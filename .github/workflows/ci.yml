name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pulse-forecast .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api pulse-forecast
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/forecast -H 'Content-Type: application/json' -d '{"sku":"SKU-001"}'
