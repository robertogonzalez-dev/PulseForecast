[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pulse-forecast"
version = "0.1.0"
description = "SKU-level demand forecasting for e-commerce: leak-free features, rolling-origin backtests, LightGBM vs baselines, served via FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Roberto Gonzalez" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.14"]
commercepulse = ["duckdb>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
pulse-train = "pulse_forecast.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pulse_forecast --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
